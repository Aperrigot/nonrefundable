<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0E0F12">
  <title>Nonrefundable</title>
  <style>
    :root { --bg: #0E0F12; --accent: #FF6B1A; --text: #D7D9DE; --muted: #8A8E98; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 8px;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); box-sizing: border-box; }
    h1 { margin: 0; font-size: 28px; font-weight: 600; color: var(--accent); }
    p { margin: 0; color: var(--muted); font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <h1>Nonrefundable</h1>
    <p>Lot 0. En construction.</p>
  </main>
</body>
</html>
